    <script>
        function toggleLinkMode(id) {
            const current = linkModes[id] || 'dc';
            linkModes[id] = current === 'dc' ? 'dr' : 'dc';
            localStorage.setItem('l1LinkModes', JSON.stringify(linkModes));
            
            const item = links.find(l => l.id === id);
            if (item) {
                showToast('Environment Toggled', `${item.title} switched to ${linkModes[id].toUpperCase()} mode`);
            }
            renderPinned();
            renderMainGrid();
        }

        function getCategories() {
            return [
                { name: 'Dashboard', icon: 'fa-house', count: links.length },
                { name: 'Monitoring', icon: 'fa-chart-line', count: links.filter(l => l.category === 'Monitoring').length },
                { name: 'Enterprise', icon: 'fa-building', count: links.filter(l => l.category === 'Enterprise').length },
                { name: 'Gateway', icon: 'fa-network-wired', count: links.filter(l => l.category === 'Gateway').length },
                { name: 'Switch', icon: 'fa-right-left', count: links.filter(l => l.category === 'Switch').length },
                { name: 'Admin', icon: 'fa-shield-halved', count: links.filter(l => l.category === 'Admin').length },
                { name: 'Pinned', icon: 'fa-thumbtack', count: links.filter(l => l.category === 'Pinned').length },
                { name: 'SMS', icon: 'fa-comment-sms', count: links.filter(l => l.category === 'SMS').length },
                { name: 'Other', icon: 'fa-folder-open', count: links.filter(l => l.category === 'Other').length }
            ];
        }

        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            if (!nav) return;
            const categories = getCategories();
            nav.innerHTML = categories.map(cat => {
                const isActive = currentCategory === cat.name;
                return `
                    <div class="space-y-1">
                        <div class="flex items-center space-x-1">
                            <button onclick="selectCategory('${cat.name}')" class="flex-1 flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${isActive ? 'bg-electric-500 text-white shadow-md font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                                <div class="flex items-center space-x-3">
                                    <i class="fa-solid ${cat.icon} w-5 text-center ${isActive ? 'text-white' : 'text-slate-400'}"></i>
                                    <span>${cat.name}</span>
                                </div>
                                <span class="text-xs px-2 py-0.5 rounded-md ${isActive ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'}">${cat.count}</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAllCategoryUrls(categoryName) {
            const matchingLinks = links.filter(l => l.category === categoryName);
            if (matchingLinks.length === 0) return;

            if (matchingLinks.length > 5) {
                if (!confirm(`This will open ${matchingLinks.length} tabs for the '${categoryName}' category. Do you want to proceed?`)) {
                    return;
                }
            }

            matchingLinks.forEach(item => {
                const mode = linkModes[item.id] || 'dc';
                const activeUrl = (mode === 'dr' && item.drUrl) ? item.drUrl : item.dcUrl;
                if (activeUrl) window.open(activeUrl, '_blank');
            });
            showToast('Batch Open', `Opened ${matchingLinks.length} URLs for ${categoryName}`);
        }

        function renderPinned() {
            const pinnedGrid = document.getElementById('pinned-grid');
            const pinnedSection = document.getElementById('pinned-section');
            const pinnedList = links.filter(l => l.pinned);
            
            if (!pinnedSection || !pinnedGrid) return;

            if (pinnedList.length === 0) {
                pinnedSection.style.display = 'none';
                return;
            }
            pinnedSection.style.display = 'block';

            pinnedGrid.innerHTML = pinnedList.map(item => {
                const hasDr = item.drUrl && item.drUrl.trim() !== '';
                const mode = linkModes[item.id] || 'dc';
                const activeUrl = (mode === 'dr' && hasDr) ? item.drUrl : item.dcUrl;

                return `
                    <div class="bg-white border border-slate-200/80 rounded-xl p-4 card-hover transition-all duration-200 relative group flex flex-col justify-between">
                        <div>
                            <div class="flex items-start justify-between mb-2">
                                <div class="h-9 w-9 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm group-hover:bg-electric-500 group-hover:text-white transition-colors">
                                    <i class="fa-solid ${item.icon || 'fa-link'}"></i>
                                </div>
                                <div class="flex items-center space-x-1.5">
                                    ${hasDr ? `
                                        <button onclick="toggleLinkMode(${item.id})" class="px-2 py-0.5 rounded text-[10px] font-bold transition-all ${mode === 'dr' ? 'bg-amber-500 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}" title="Toggle DC/DR">
                                            ${mode.toUpperCase()}
                                        </button>
                                    ` : `
                                        <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-100 text-slate-400">DC ONLY</span>
                                    `}
                                    <button onclick="togglePin(${item.id})" class="text-amber-400 hover:text-amber-500 p-1" title="Unpin">
                                        <i class="fa-solid fa-star text-sm"></i>
                                    </button>
                                </div>
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm mb-1 truncate">${item.title}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 mb-2">${item.desc || 'Operational gateway URL.'}</p>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-100 mt-2">
                            <span class="text-[10px] font-semibold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${item.tag || item.category}</span>
                            <a href="${activeUrl}" target="_blank" class="inline-flex items-center space-x-1 text-xs font-semibold text-electric-500 hover:text-electric-600">
                                <span>Launch</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMainGrid() {
            const grid = document.getElementById('urls-grid');
            if (!grid) return;
            
            let filtered = links;

            if (currentCategory !== 'Dashboard') {
                filtered = filtered.filter(l => l.category === currentCategory);
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(l => 
                    l.title.toLowerCase().includes(q) || 
                    (l.desc && l.desc.toLowerCase().includes(q)) || 
                    l.category.toLowerCase().includes(q) ||
                    l.tag.toLowerCase().includes(q) ||
                    l.dcUrl.toLowerCase().includes(q) ||
                    (l.drUrl && l.drUrl.toLowerCase().includes(q))
                );
            }

            const sectionTitle = document.getElementById('section-title');
            const sectionSubtitle = document.getElementById('section-subtitle');
            const resultBadge = document.getElementById('result-count-badge');

            if (sectionTitle) sectionTitle.innerText = currentCategory === 'Dashboard' ? 'All Department Portals' : currentCategory + ' Portals';
            if (sectionSubtitle) sectionSubtitle.innerText = currentCategory === 'Dashboard' ? 'Browse and launch all departmental operational links with individual DC/DR toggles' : `Showing links categorized under ${currentCategory}`;
            if (resultBadge) resultBadge.innerText = `${filtered.length} URL${filtered.length === 1 ? '' : 's'} Found`;

            const openAllContainer = document.getElementById('open-all-container');
            if (openAllContainer) {
                if (currentCategory !== 'Dashboard' && filtered.length > 0) {
                    openAllContainer.innerHTML = `
                        <button onclick="openAllCategoryUrls('${currentCategory}')" class="flex items-center space-x-2 bg-slate-800 hover:bg-navy-900 text-white px-3.5 py-2 rounded-lg text-xs font-semibold shadow-sm transition-all">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            <span>Open All ${currentCategory} (${filtered.length})</span>
                        </button>
                    `;
                } else {
                    openAllContainer.innerHTML = '';
                }
            }

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-dashed border-slate-300">
                        <div class="h-12 w-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3 text-xl">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base">No matching URLs found</h3>
                        <p class="text-xs text-slate-500 mt-1">Try adjusting your search keyword or selecting another category.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                const hasDr = item.drUrl && item.drUrl.trim() !== '';
                const mode = linkModes[item.id] || 'dc';
                const activeUrl = (mode === 'dr' && hasDr) ? item.drUrl : item.dcUrl;

                return `
                    <div class="bg-white border border-slate-200/80 rounded-2xl p-5 card-hover transition-all duration-200 flex flex-col justify-between group">
                        <div>
                            <div class="flex items-start justify-between mb-3">
                                <div class="h-10 w-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-lg group-hover:bg-electric-500 group-hover:text-white transition-all shadow-sm">
                                    <i class="fa-solid ${item.icon || 'fa-link'}"></i>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">${item.tag || item.category}</span>
                                    ${hasDr ? `
                                        <button onclick="toggleLinkMode(${item.id})" class="px-2.5 py-1 rounded text-[10px] font-bold transition-all shadow-sm ${mode === 'dr' ? 'bg-amber-500 text-white' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'}" title="Toggle between DC and DR endpoint">
                                            <i class="fa-solid fa-server mr-1"></i>${mode.toUpperCase()}
                                        </button>
                                    ` : `
                                        <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-400">DC ONLY</span>
                                    `}
                                    <button onclick="togglePin(${item.id})" class="text-slate-300 hover:text-amber-400 p-1 transition-colors ${item.pinned ? 'text-amber-400' : ''}" title="${item.pinned ? 'Unpin' : 'Pin to top'}">
                                        <i class="fa-solid fa-star text-sm"></i>
                                    </button>
                                </div>
                            </div>

                            <h3 class="font-bold text-slate-900 text-base mb-1 group-hover:text-electric-500 transition-colors">${item.title}</h3>
                            <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-3">${item.desc || 'Internal operational system endpoint.'}</p>
                        </div>

                        <div>
                            <div class="text-[11px] font-mono text-slate-400 truncate mb-3 bg-slate-50 px-2.5 py-1 rounded border border-slate-100 select-all" title="${activeUrl}">
                                <strong class="text-slate-500">${mode.toUpperCase()}:</strong> ${activeUrl}
                            </div>
                            <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                                <span class="text-xs font-medium text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md">${item.category}</span>
                                <div class="flex items-center space-x-2">
                                    <button onclick="copyToClipboard('${activeUrl}')" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs transition-colors" title="Copy URL">
                                        <i class="fa-solid fa-copy"></i>
                                    </button>
                                    <a href="${activeUrl}" target="_blank" class="inline-flex items-center space-x-1.5 bg-blue-50 hover:bg-electric-500 text-blue-600 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all">
                                        <span>Open</span>
                                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectCategory(catName) {
            currentCategory = catName;
            renderSidebar();
            renderMainGrid();
        }

        function togglePin(id) {
            const item = links.find(l => l.id === id);
            if (item) {
                item.pinned = !item.pinned;
                renderSidebar();
                renderPinned();
                renderMainGrid();
                showToast('Success', item.pinned ? 'Pinned to quick access' : 'Removed from quick access');
            }
        }

        function copyToClipboard(url) {
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('Copied', 'URL copied to clipboard.');
        }

        function openAddModal() {
            const modal = document.getElementById('add-modal');
            const container = document.getElementById('modal-container');
            if (!modal || !container) return;
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('add-modal');
            const container = document.getElementById('modal-container');
            if (!modal || !container) return;
            modal.classList.add('opacity-0');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                const form = document.getElementById('add-url-form');
                if (form) form.reset();
            }, 300);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const dcUrlVal = document.getElementById('new-dc-url').value;
            const drUrlVal = document.getElementById('new-dr-url').value;
            
            const newLink = {
                id: Date.now(),
                title: document.getElementById('new-title').value,
                category: document.getElementById('new-category').value,
                tag: document.getElementById('new-tag').value || 'Custom',
                dcUrl: dcUrlVal,
                drUrl: drUrlVal || '',
                desc: 'User-registered operational gateway.',
                icon: 'fa-link',
                pinned: false
            };

            links.unshift(newLink);
            renderSidebar();
            renderPinned();
            renderMainGrid();
            closeAddModal();
            showToast('Portal Registered', 'New custom URL added successfully.');
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        window.onload = function() {
            const globalSearch = document.getElementById('global-search');
            if (globalSearch) {
                globalSearch.addEventListener('input', (e) => {
                    searchQuery = e.target.value;
                    renderMainGrid();
                });
            }
            renderSidebar();
            renderPinned();
            renderMainGrid();
        };
    </script>
</body>
</html>
