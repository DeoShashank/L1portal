                    </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Target URL</label>
                    <input type="text" id="new-url" required placeholder="http://10.x.x.x:port/" class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-electric-500/20 focus:border-electric-500 outline-none">
                </div>

                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Description / Notes</label>
                    <textarea id="new-desc" rows="2" required placeholder="Brief summary of what this tool does..." class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm text-slate-800 focus:ring-2 focus:ring-electric-500/20 focus:border-electric-500 outline-none resize-none"></textarea>

    <!-- Toast Notification -->

    <script>
        // Categories list for sidebar computed from actual links count
        function getCategories() {
            return [
                { name: 'Dashboard', icon: 'fa-house', count: links.length },
                { name: 'Monitoring', icon: 'fa-chart-line', count: links.filter(l => l.category === 'Monitoring').length },
                { name: 'Enterprise', icon: 'fa-building', count: links.filter(l => l.category === 'Enterprise').length },
                { name: 'Gateway', icon: 'fa-network-wired', count: links.filter(l => l.category === 'Gateway').length },
                { name: 'Switch', icon: 'fa-right-left', count: links.filter(l => l.category === 'Switch').length },
                { name: 'Admin', icon: 'fa-shield-halved', count: links.filter(l => l.category === 'Admin').length },
                { name: 'Pinned', icon: 'fa-thumbtack', count: links.filter(l => l.category === 'Pinned').length },
                { name: 'SMS', icon: 'fa-comment-sms', count: links.filter(l => l.category === 'SMS').length }
            ];
        }

        // Render Sidebar Navigation
        function renderSidebar() {
            const nav = document.getElementById('sidebar-nav');
            const categories = getCategories();
            nav.innerHTML = categories.map(cat => {
                const isActive = currentCategory === cat.name;
                return `
                    <button onclick="selectCategory('${cat.name}')" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${isActive ? 'bg-electric-500 text-white shadow-md shadow-electric-500/25 font-semibold' : 'text-slate-400 hover:text-white hover:bg-slate-800/60'}">
                        <div class="flex items-center space-x-3">
                            <i class="fa-solid ${cat.icon} w-5 text-center ${isActive ? 'text-white' : 'text-slate-400'}"></i>
                            <span>${cat.name}</span>
                        </div>
                        <span class="text-xs px-2 py-0.5 rounded-md ${isActive ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'}">${cat.count}</span>
                    </button>
                `;
            }).join('');
        }

        // Render Pinned Quick Access Row
        function renderPinned() {
            const pinnedGrid = document.getElementById('pinned-grid');
            const pinnedList = links.filter(l => l.pinned);
            
            if (pinnedList.length === 0) {
                document.getElementById('pinned-section').style.display = 'none';
                return;
            }
            document.getElementById('pinned-section').style.display = 'block';

            pinnedGrid.innerHTML = pinnedList.map(item => `
                <div class="bg-white border border-slate-200/80 rounded-xl p-4 card-hover transition-all duration-200 relative group flex flex-col justify-between">
                    <div>
                        <div class="flex items-start justify-between mb-2">
                            <div class="h-9 w-9 rounded-lg bg-electric-50 text-electric-500 flex items-center justify-center font-bold text-sm group-hover:bg-electric-500 group-hover:text-white transition-colors">
                                <i class="fa-solid ${item.icon || 'fa-link'}"></i>
                            </div>
                            <div class="flex items-center space-x-1">
                                <button onclick="togglePin(${item.id})" class="text-amber-400 hover:text-amber-500 p-1" title="Unpin">
                                    <i class="fa-solid fa-star text-sm"></i>
                                </button>
                            </div>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm mb-1 truncate">${item.title}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2 mb-2">${item.desc}</p>
                    </div>
                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 mt-2">
                        <span class="text-[10px] font-semibold text-electric-600 bg-electric-50 px-2 py-0.5 rounded">${item.tag || item.category}</span>
                        <a href="${item.url}" target="_blank" class="inline-flex items-center space-x-1 text-xs font-semibold text-electric-500 hover:text-electric-600">
                            <span>Launch</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Render Main Grid based on Search & Category filter
        function renderMainGrid() {
            const grid = document.getElementById('urls-grid');
            let filtered = links;

            if (currentCategory !== 'Dashboard') {
                filtered = filtered.filter(l => l.category === currentCategory);
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(l => 
                    l.title.toLowerCase().includes(q) || 
                    l.desc.toLowerCase().includes(q) || 
                    l.category.toLowerCase().includes(q) ||
                    l.tag.toLowerCase().includes(q) ||
                    l.url.toLowerCase().includes(q)
                );
            }

            document.getElementById('section-title').innerText = currentCategory === 'Dashboard' ? 'All Department Portals' : currentCategory + ' Portals';
            document.getElementById('section-subtitle').innerText = currentCategory === 'Dashboard' ? 'Browse and launch all 29 departmental operational links' : `Showing links categorized under ${currentCategory}`;
            document.getElementById('result-count-badge').innerText = `${filtered.length} URL${filtered.length === 1 ? '' : 's'} Found`;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center bg-white rounded-2xl border border-dashed border-slate-300">
                        <div class="h-12 w-12 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center mx-auto mb-3 text-xl">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base">No matching URLs found</h3>
                        <p class="text-xs text-slate-500 mt-1">Try adjusting your search keyword or selecting another category.</p>
                        <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                            Clear Search & Filters
                        </button>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="bg-white border border-slate-200/80 rounded-2xl p-5 card-hover transition-all duration-200 flex flex-col justify-between group">
                    <div>
                        <div class="flex items-start justify-between mb-3">
                            <div class="h-10 w-10 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center font-bold text-lg group-hover:bg-electric-500 group-hover:text-white transition-all shadow-sm">
                                <i class="fa-solid ${item.icon || 'fa-link'}"></i>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] font-bold px-2.5 py-1 rounded-md bg-slate-100 text-slate-600">${item.tag || item.category}</span>
                                <button onclick="togglePin(${item.id})" class="text-slate-300 hover:text-amber-400 p-1 transition-colors ${item.pinned ? 'text-amber-400' : ''}" title="${item.pinned ? 'Unpin' : 'Pin to top'}">
                                    <i class="fa-solid fa-star text-sm"></i>
                                </button>
                            </div>
                        </div>

                        <h3 class="font-bold text-slate-900 text-base mb-1 group-hover:text-electric-500 transition-colors">${item.title}</h3>
                        <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mb-3">${item.desc}</p>
                        ${item.comment ? `<div class="text-[11px] text-amber-700 bg-amber-50 px-2.5 py-1 rounded border border-amber-200 mb-3"><i class="fa-solid fa-circle-info mr-1"></i>${item.comment}</div>` : ''}
                    </div>

                    <div>
                        <div class="text-[11px] font-mono text-slate-400 truncate mb-3 bg-slate-50 px-2.5 py-1 rounded border border-slate-100 select-all" title="${item.url}">
                            ${item.url}
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-slate-100">
                            <span class="text-xs font-medium text-slate-600 bg-slate-100 px-2.5 py-1 rounded-md">${item.category}</span>
                            <div class="flex items-center space-x-2">
                                <button onclick="copyToClipboard('${item.url}')" class="p-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs transition-colors" title="Copy URL">
                                    <i class="fa-solid fa-copy"></i>
                                </button>
                                <a href="${item.url}" target="_blank" class="inline-flex items-center space-x-1.5 bg-electric-50 hover:bg-electric-500 text-electric-600 hover:text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition-all">
                                    <span>Open</span>
                                    <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function selectCategory(catName) {
            currentCategory = catName;
            renderSidebar();
            renderMainGrid();
        }

        function resetFilters() {
            currentCategory = 'Dashboard';
            searchQuery = '';
            document.getElementById('global-search').value = '';
            renderSidebar();
            renderPinned();
            renderMainGrid();
        }

        function togglePin(id) {
            const item = links.find(l => l.id === id);
            if (item) {
                item.pinned = !item.pinned;
                saveAndRefresh();
                showToast('Success', item.pinned ? 'Pinned to quick access' : 'Removed from quick access');
            }
        }

        function copyToClipboard(url) {
            const textarea = document.createElement('textarea');
            textarea.value = url;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            showToast('Copied', 'URL copied to clipboard.');
        }

        function openAddModal() {
            const modal = document.getElementById('add-modal');
            const container = document.getElementById('modal-container');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                container.classList.remove('scale-95');
                container.classList.add('scale-100');
            }, 10);
        }

        function closeAddModal() {
            const modal = document.getElementById('add-modal');
            const container = document.getElementById('modal-container');
            modal.classList.add('opacity-0');
            container.classList.remove('scale-100');
            container.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('add-url-form').reset();
            }, 300);
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const newLink = {
                id: Date.now(),
                title: document.getElementById('new-title').value,
                category: document.getElementById('new-category').value,
                tag: document.getElementById('new-tag').value || 'Custom',
                url: document.getElementById('new-url').value,
                desc: document.getElementById('new-desc').value,
                icon: 'fa-link',
                pinned: false,
                comment: 'Custom added link'
            };

            links.unshift(newLink);
            saveAndRefresh();
            closeAddModal();
            showToast('Portal Registered', 'New custom URL added successfully.');
        }

        function saveAndRefresh() {
            localStorage.setItem('l1PortalLinks', JSON.stringify(links));
            renderSidebar();
            renderPinned();
            renderMainGrid();
        }

        function showToast(title, msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        document.getElementById('global-search').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderMainGrid();
        });

        window.onload = function() {
            renderSidebar();
            renderPinned();
            renderMainGrid();
        };
    </script>
</body>
</html>
