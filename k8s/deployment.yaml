apiVersion: apps/v1
kind: Deployment
metadata:
  name: l1portal
  labels:
    app: l1portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: l1portal
  template:
    metadata:
      labels:
        app: l1portal
    spec:
      containers:
        - name: l1portal
          # IMAGE_PLACEHOLDER is replaced by the Jenkins pipeline with the real image
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
